name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  quality:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --prod --audit-level moderate || true

      - name: Version consistency
        run: node scripts/check-release-version.mjs

      - name: Build
        run: pnpm build

      # 빌드한 CLI 를 Node ESM 으로 띄운다 — SDK 의 CommonJS 내보내기를 이름으로 못 읽으면 시작부터 죽는다(0.14.0)
      - name: CLI starts
        run: node packages/cli/dist/index.js --version

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Upload coverage
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: packages/*/coverage/

  # 이슈 #8 — Windows 의 볼트 경로(`\`)는 ubuntu 에서 드러나지 않는다. 같은 시험을 Windows 에서도 돌린다.
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      # 픽스처의 줄 끝을 LF 그대로 받는다 — 바뀌면 왕복 시험이 줄 끝으로 갈린다.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
