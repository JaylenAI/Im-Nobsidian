name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The Obsidian plugin ships as release assets, not npm — exactly three files, which is all the
      # community directory downloads. The SQLite engine (sql.js wasm) is inside main.js (ADR-031).
      # manifest.json and versions.json live at the repository root, where Obsidian and BRAT read
      # them (ADR-032). Checked before npm publish, so a release that fails here publishes nothing.
      - name: Verify plugin assets
        id: plugin
        run: |
          for f in packages/obsidian-plugin/main.js manifest.json packages/obsidian-plugin/styles.css; do
            test -s "$f" || { echo "::error::plugin asset missing or empty: $f"; exit 1; }
          done
          # Tag == every package.json / manifest.json version, versions.json entry, release notes, CHANGELOG.
          VERSION=$(node scripts/check-release-version.mjs "$GITHUB_REF_NAME")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: pnpm --filter @im-nobsidian/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: pnpm --filter im-nobsidian publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Release title = notes H1. Write "# Im-Nobsidian vX.Y.Z — Subtitle" to get a subtitle (falls back to the bare version).
      - name: Resolve release title from notes
        id: relmeta
        run: |
          NOTES="docs/07-release/RELEASE_NOTES_${{ github.ref_name }}.md"
          TITLE=$(grep -m1 '^# ' "$NOTES" | sed -E 's/^#[[:space:]]*//; s/^Im-Nobsidian[[:space:]]+//')
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      # Obsidian downloads from releases/download/<manifest version>/ — the tag has no "v". The
      # repository tags releases "vX.Y.Z", so the release itself goes on the bare "X.Y.Z" tag at the
      # same commit (created here when it does not exist yet).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.plugin.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.relmeta.outputs.title }}
          body_path: docs/07-release/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            packages/obsidian-plugin/main.js
            manifest.json
            packages/obsidian-plugin/styles.css
