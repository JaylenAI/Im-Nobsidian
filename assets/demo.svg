<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <style>
    @keyframes t { from { width: 0 } }
    @keyframes blink { 50% { opacity: 0 } }
    @keyframes fadein { to { opacity: 1 } }

    .bg { fill: #1e1e2e; }
    .chrome { fill: #313244; }
    .title { fill: #cdd6f4; font: 13px 'SF Mono','Cascadia Code','Fira Code',monospace; }

    text {
      font: 14px 'SF Mono','Cascadia Code','Fira Code','Courier New',monospace;
      fill: #cdd6f4;
    }
    .prompt { fill: #a6e3a1; }
    .cmd { fill: #89b4fa; }
    .flag { fill: #f9e2af; }
    .success { fill: #a6e3a1; }
    .info { fill: #94e2d5; }
    .dim { fill: #6c7086; }
    .num { fill: #fab387; }
    .warn { fill: #f9e2af; }

    .line { opacity: 0; animation: fadein 0.01s forwards; }
    .l1  { animation-delay: 0.3s; }
    .l2  { animation-delay: 0.8s; }
    .l3  { animation-delay: 1.6s; }
    .l4  { animation-delay: 2.0s; }
    .l5  { animation-delay: 2.4s; }
    .l6  { animation-delay: 2.8s; }
    .l7  { animation-delay: 3.5s; }
    .l8  { animation-delay: 4.0s; }
    .l9  { animation-delay: 4.3s; }
    .l10 { animation-delay: 4.6s; }
    .l11 { animation-delay: 4.9s; }
    .l12 { animation-delay: 5.2s; }
    .l13 { animation-delay: 5.5s; }
    .l14 { animation-delay: 6.2s; }
    .l15 { animation-delay: 6.7s; }
    .l16 { animation-delay: 7.0s; }
    .l17 { animation-delay: 7.3s; }
    .l18 { animation-delay: 7.6s; }
    .l19 { animation-delay: 7.9s; }
    .l20 { animation-delay: 8.2s; }
    .l21 { animation-delay: 8.9s; }
    .l22 { animation-delay: 9.4s; }
    .l23 { animation-delay: 9.7s; }
    .l24 { animation-delay: 10.0s; }
    .l25 { animation-delay: 10.3s; }

    .cursor {
      animation: blink 1s step-end infinite;
      fill: #cdd6f4;
    }
  </style>

  <!-- Window -->
  <rect class="bg" width="800" height="520" rx="10"/>
  <rect class="chrome" width="800" height="36" rx="10"/>
  <rect class="bg" x="0" y="26" width="800" height="10"/>
  <circle cx="20" cy="18" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="18" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="18" r="6" fill="#a6e3a1"/>
  <text class="title" x="370" y="22" text-anchor="middle">Terminal</text>

  <!-- Line 1: nobsi init -->
  <g class="line l1">
    <text y="62" x="20"><tspan class="prompt">~/vault $</tspan> <tspan class="cmd">nobsi init</tspan></text>
  </g>

  <!-- Line 2: Token input -->
  <g class="line l2">
    <text y="82" x="20"><tspan class="dim">? Notion Integration Token:</tspan> <tspan class="dim">ntn_****</tspan></text>
  </g>

  <!-- Line 3: Connection success -->
  <g class="line l3">
    <text y="102" x="20"><tspan class="success">&#x2714; Notion &#xC5F0;&#xACB0; &#xC131;&#xACF5;</tspan></text>
  </g>

  <!-- Line 4-5: Page selection -->
  <g class="line l4">
    <text y="126" x="20"><tspan class="info">&#xC0AC;&#xC6A9; &#xAC00;&#xB2A5;&#xD55C; &#xB8E8;&#xD2B8; &#xD398;&#xC774;&#xC9C0;:</tspan></text>
  </g>
  <g class="line l5">
    <text y="146" x="20"><tspan class="dim">  [1] My Workspace</tspan></text>
  </g>

  <!-- Line 6: Init complete -->
  <g class="line l6">
    <text y="170" x="20"><tspan class="success">&#x2714; Im-Nobsidian &#xCD08;&#xAE30;&#xD654; &#xC644;&#xB8CC;!</tspan></text>
  </g>

  <!-- Line 7: push command -->
  <g class="line l7">
    <text y="198" x="20"><tspan class="prompt">~/vault $</tspan> <tspan class="cmd">nobsi push</tspan></text>
  </g>

  <!-- Line 8: Spinner -->
  <g class="line l8">
    <text y="218" x="20"><tspan class="info">&#x25E0; Push &#xC911;... [1/12] test-note.md</tspan></text>
  </g>
  <g class="line l9">
    <text y="238" x="20"><tspan class="info">&#x25E0; Push &#xC911;... [7/12] api-design.md</tspan></text>
  </g>
  <g class="line l10">
    <text y="258" x="20"><tspan class="info">&#x25E0; Push &#xC911;... [12/12] journal.md</tspan></text>
  </g>

  <!-- Line 11-14: Push result -->
  <g class="line l11">
    <text y="282" x="20"><tspan class="success">&#x2714; Push &#xC644;&#xB8CC;</tspan> <tspan class="dim">(4.2s)</tspan></text>
  </g>
  <g class="line l12">
    <text y="302" x="20"><tspan>  &#xC0DD;&#xC131;: </tspan><tspan class="num">12</tspan></text>
  </g>
  <g class="line l13">
    <text y="322" x="20"><tspan>  &#xC218;&#xC815;: </tspan><tspan class="num">0</tspan></text>
  </g>

  <!-- Line 15: pull command -->
  <g class="line l14">
    <text y="350" x="20"><tspan class="prompt">~/vault $</tspan> <tspan class="cmd">nobsi pull</tspan></text>
  </g>

  <!-- Line 16-18: Pull result -->
  <g class="line l15">
    <text y="370" x="20"><tspan class="success">&#x2714; Pull &#xC644;&#xB8CC;</tspan> <tspan class="dim">(2.1s)</tspan></text>
  </g>
  <g class="line l16">
    <text y="390" x="20"><tspan>  &#xC0DD;&#xC131;: </tspan><tspan class="num">0</tspan></text>
  </g>
  <g class="line l17">
    <text y="410" x="20"><tspan>  &#xC218;&#xC815;: </tspan><tspan class="num">3</tspan></text>
  </g>

  <!-- Line 19: sync command -->
  <g class="line l18">
    <text y="438" x="20"><tspan class="prompt">~/vault $</tspan> <tspan class="cmd">nobsi sync</tspan></text>
  </g>

  <!-- Line 20-21: Sync result -->
  <g class="line l19">
    <text y="458" x="20"><tspan class="success">&#x2714; Sync &#xC644;&#xB8CC;</tspan> <tspan class="dim">(5.8s)</tspan></text>
  </g>
  <g class="line l20">
    <text y="478" x="20"><tspan>  Push: </tspan><tspan class="num">2</tspan><tspan class="dim"> &#xC0DD;&#xC131;</tspan><tspan>  Pull: </tspan><tspan class="num">3</tspan><tspan class="dim"> &#xC218;&#xC815;</tspan></text>
  </g>

  <!-- Final prompt with cursor -->
  <g class="line l21">
    <text y="502" x="20"><tspan class="prompt">~/vault $</tspan></text>
    <rect class="cursor" x="108" y="490" width="8" height="16" rx="1"/>
  </g>
</svg>
